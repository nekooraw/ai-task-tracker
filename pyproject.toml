[project]
name = "task-tracker-with-ai"
version = "0.1.0"
description = ""
authors = [
    {name = "nekoooraw"}
]
readme = "README.md"
requires-python = ">=3.14.7,<4.0"
dependencies = [
    "fastapi (>=0.162.0,<0.163.0)",
    "uvicorn[standard] (>=0.54.0,<0.55.0)",
    "sqlalchemy (>=2.1.6,<3.0.0)",
    "aiosqlite (>=0.22.1,<0.23.0)",
    "pydantic (>=2.14.2,<3.0.0)",
    "pwdlib[argon2] (>=0.3.1,<0.4.0)",
    "pyjwt (>=2.15.1,<3.0.0)",
    "alembic (>=1.20.1,<2.0.0)",
    "email-validator (>=2.3.0,<3.0.0)",
    "python-dotenv (>=1.2.4,<2.0.0)",
    "python-multipart (>=0.0.32,<0.0.33)",
    "google-genai (>=2.34.0,<3.0.0)",
    "groq (>=1.7.0,<2.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.2.0,<10.0.0)",
    "pytest-asyncio (>=1.4.1,<2.0.0)",
    "httpx (>=0.28.1,<0.29.0)"
]
